<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- ===== 白大褂（身体） ===== -->
  <path d="M42 300 C42 236 66 200 102 183 L198 183 C234 200 258 236 258 300 Z" fill="#FFFFFF" stroke="#BFD8E6" stroke-width="3"/>
  <path d="M128 183 L150 216 L172 183" fill="none" stroke="#8FC4DB" stroke-width="3" stroke-linejoin="round"/>
  <path d="M104 183 L150 212 L196 183 L172 183 L150 204 L128 183 Z" fill="#D8ECF5"/>
  <rect x="192" y="244" width="30" height="26" rx="6" fill="none" stroke="#BFD8E6" stroke-width="2.5"/>

  <!-- ===== 耳朵 ===== -->
  <path d="M86 84 C78 38 122 36 136 72 Z" fill="#FFF6EA" stroke="#EBDCC4" stroke-width="2"/>
  <path d="M214 84 C222 38 178 36 164 72 Z" fill="#FFF6EA" stroke="#EBDCC4" stroke-width="2"/>
  <path d="M96 74 C92 48 120 48 129 68 Z" fill="#F9C9D2"/>
  <path d="M204 74 C208 48 180 48 171 68 Z" fill="#F9C9D2"/>

  <!-- ===== 头 ===== -->
  <ellipse cx="150" cy="112" rx="82" ry="74" fill="#FFF6EA" stroke="#EBDCC4" stroke-width="2"/>

  <!-- ===== 胡须 ===== -->
  <g stroke="#D8C6A8" stroke-width="2.5" stroke-linecap="round">
    <line x1="72" y1="132" x2="102" y2="136"/>
    <line x1="72" y1="148" x2="102" y2="148"/>
    <line x1="228" y1="132" x2="198" y2="136"/>
    <line x1="228" y1="148" x2="198" y2="148"/>
  </g>

  <!-- ===== 眼睛（带眨眼动画） ===== -->
  <g>
    <animate attributeName="opacity" values="1;1;0.1;1;1" keyTimes="0;0.9;0.94;0.98;1" dur="3.8s" repeatCount="indefinite"/>
    <circle cx="122" cy="110" r="7.5" fill="#4A5568"/>
    <circle cx="178" cy="110" r="7.5" fill="#4A5568"/>
    <circle cx="124.5" cy="107" r="2.5" fill="#FFFFFF"/>
    <circle cx="180.5" cy="107" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- ===== 圆框眼镜 ===== -->
  <circle cx="122" cy="112" r="24" fill="#D8ECF5" opacity="0.35"/>
  <circle cx="178" cy="112" r="24" fill="#D8ECF5" opacity="0.35"/>
  <g fill="none" stroke="#8FC4DB" stroke-width="5">
    <circle cx="122" cy="112" r="24"/>
    <circle cx="178" cy="112" r="24"/>
  </g>
  <path d="M146 112 Q150 105 154 112" fill="none" stroke="#8FC4DB" stroke-width="5" stroke-linecap="round"/>
  <path d="M98 106 L84 96" stroke="#8FC4DB" stroke-width="5" stroke-linecap="round"/>
  <path d="M202 106 L216 96" stroke="#8FC4DB" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== 鼻子 ===== -->
  <path d="M145 133 L155 133 L150 141 Z" fill="#F9C9D2" stroke="#EFA8B6" stroke-width="1"/>

  <!-- ===== 嘴 ===== -->
  <path d="M150 141 Q143 150 136 145 M150 141 Q157 150 164 145" fill="none" stroke="#4A5568" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== 腮红 ===== -->
  <circle cx="99" cy="133" r="9" fill="#F9C9D2" opacity="0.8"/>
  <circle cx="201" cy="133" r="9" fill="#F9C9D2" opacity="0.8"/>

  <!-- ===== 晶体结构模型（立方晶胞，球棍模型） ===== -->
  <g stroke="#B7CDD9" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="210" x2="160" y2="210"/>
    <line x1="160" y1="210" x2="160" y2="270"/>
    <line x1="160" y1="270" x2="100" y2="270"/>
    <line x1="100" y1="270" x2="100" y2="210"/>
    <line x1="140" y1="180" x2="200" y2="180"/>
    <line x1="200" y1="180" x2="200" y2="240"/>
    <line x1="200" y1="240" x2="140" y2="240"/>
    <line x1="140" y1="240" x2="140" y2="180"/>
    <line x1="100" y1="210" x2="140" y2="180"/>
    <line x1="160" y1="210" x2="200" y2="180"/>
    <line x1="160" y1="270" x2="200" y2="240"/>
    <line x1="100" y1="270" x2="140" y2="240"/>
  </g>
  <g fill="#A9D3E6" stroke="#8FC4DB" stroke-width="2">
    <circle cx="100" cy="210" r="10"/>
    <circle cx="160" cy="210" r="10"/>
    <circle cx="160" cy="270" r="10"/>
    <circle cx="100" cy="270" r="10"/>
    <circle cx="140" cy="180" r="10"/>
    <circle cx="200" cy="180" r="10"/>
    <circle cx="200" cy="240" r="10"/>
    <circle cx="140" cy="240" r="10"/>
  </g>

  <!-- ===== 爪子（捧着模型） ===== -->
  <ellipse cx="130" cy="280" rx="20" ry="13" fill="#FFF6EA" stroke="#EBDCC4" stroke-width="2"/>
  <ellipse cx="170" cy="280" rx="20" ry="13" fill="#FFF6EA" stroke="#EBDCC4" stroke-width="2"/>
</svg>
